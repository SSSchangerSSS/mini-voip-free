name: release

# Release pipeline (spec 16): manual dispatch + environment approval.
# FAIL-CLOSED: without employer signing material the jobs stop with an explicit
# BLOCKED message — no unsigned artifacts are ever labeled "installable release".

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0) — must match CHANGELOG"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android signed APK (arm64)
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Restore keystore from secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "BLOCKED: ANDROID_KEYSTORE_B64 secret missing (PREFLIGHT B6) — refusing to produce an unsigned 'release'"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/smi-upload.jks"
      - name: Build + sign
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --dart-define=SMI_BUILD_VERSION=${{ github.event.inputs.version }}
      - name: Checksums
        run: |
          find apps/mobile/build/app/outputs/flutter-apk -name '*release.apk' \
            -exec sha256sum {} \; | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.event.inputs.version }}
          path: |
            apps/mobile/build/app/outputs/flutter-apk/*arm64*release.apk
            apk-sha256.txt
          if-no-files-found: error

  ios:
    name: iOS archive (macOS runner)
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Preflight Apple signing material
        env:
          APPLE_CERT_P12_B64: ${{ secrets.APPLE_CERT_P12_B64 }}
          APPLE_PROVISION_PROFILE_B64: ${{ secrets.APPLE_PROVISION_PROFILE_B64 }}
        run: |
          if [ -z "$APPLE_CERT_P12_B64" ] || [ -z "$APPLE_PROVISION_PROFILE_B64" ]; then
            echo "BLOCKED: Apple signing secrets missing (PREFLIGHT B2/B4) — iOS release is BLOCKED, not skipped"
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Build IPA
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build ipa --release
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.event.inputs.version }}
          path: apps/mobile/build/ios/ipa/*.ipa
          if-no-files-found: error

  manifest:
    name: Release manifest
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose manifest (checksums recorded post-build, spec 16.4)
        run: |
          mkdir -p dist
          cat > dist/release-manifest.json <<EOF
          {
            "version": "${{ github.event.inputs.version }}",
            "commit": "${{ github.sha }}",
            "createdAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "schemaVersion": 1,
            "toolchain": "toolchain.lock.json@${{ github.sha }}",
            "artifacts": []
          }
          EOF
          cat dist/release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.event.inputs.version }}
          path: dist/release-manifest.json
