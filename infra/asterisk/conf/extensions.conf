;
; mini-voip-free — extensions.conf
; Algorithmic contract of the SMI handshake (spec 8.2). Every variable below is
; server-derived; no client input is ever used as a dial string or AMI target.
;
; ⚠ P2 GATE: `${VAR}` re-evaluation inside WaitForCondition must be verified against
; the live Asterisk 22.11.0 build (docs/AMI-MAPPING.md, [S07]). A single expansion at
; line execution would break the wait semantics — the dialplan must be validated with
; `dialplan show` and live cancel-during-wait tests before any release claim.
;

[general]
static=no
writeprotect=yes
clearglobalvars=no

[globals]
SMI_ADMISSION_WAIT=3          ; AMI_ADMISSION_TIMEOUT_SECONDS (spec 4.2)

; ─── Entry: only authenticated endpoints land here (context of smi-endpoint-template) ───
[smi-internal]
; internal extensions 100..199; 100 is reserved and never dialable
exten => _1[0-9][0-9],1,NoOp(SMI inbound: caller=${CHANNEL(endpoint)} callee=${EXTEN})
 same => n,Goto(smi-call,${EXTEN},1)

; absolutely nothing else may be dialed — no trunks, no PSTN, no escape contexts
exten => _!,1,Goto(smi-reject,unallocated,1)

; ─── The single outbound INVITE path: 8.2 pseudocode, executable form ───
[smi-call]
exten => _1[0-9][0-9],1,Set(SMI_CALLER=${CHANNEL(endpoint)})
 ; self-call reject (T10)
 same => n,GotoIf($["${SMI_CALLER}" = "${EXTEN}"]?smi-reject,self,1)
 ; destination must be a configured endpoint; unknown numbers never leave this PBX
 same => n,GotoIf($["${PJSIP_ENDPOINT(${EXTEN},context)}" = ""]?smi-reject,unavailable,1)
 ; handshake defaults
 same => n,Set(SMI_ADMITTED=0)
 same => n,Set(SMI_DIAL_ALLOWED=0)
 same => n,Set(__SMI_CALLEE=${EXTEN})
 same => n,Set(SMI_DEADLINE_EPOCH=0)
 same => n,Set(SMI_REJECT_CAUSE=0)
 ; hangup handler fires SMICallFinished for every teardown path (spec 8.2, [S05])
 same => n,Set(CHANNEL(hangup_handler_push)=smi-hangup,s,1)
 ; attemptId is correlation data ONLY — never an authorization input (spec 4.1)
 same => n,Set(SMI_ATTEMPT_ID=${PJSIP_HEADER(read,X-SMI-Attempt-ID)})
 ; channel is NOT answered here — provisional signalling only (spec 5.2 step 3)
 same => n,UserEvent(SMICallRequested,SchemaVersion: 1,PbxUniqueId: ${CHANNEL(uniqueid)},Channel: ${CHANNEL(name)},CallerEndpoint: ${SMI_CALLER},Callee: ${SMI_CALLEE},AttemptId: ${SMI_ATTEMPT_ID})
 same => n,WaitForCondition(#,#["#{SMI_ADMITTED}" != "0"],${SMI_ADMISSION_WAIT},0.05)
 same => n,GotoIf($["${SMI_ADMITTED}" != "1"]?smi-reject,by-cause,1)
 ; admitted → provisional ringing; still no Answer()
 same => n,Ringing()
 ; wait until device ready — only for the REMAINING deadline, never a fresh full timeout
 same => n,Set(SMI_REMAINING=$[${SMI_DEADLINE_EPOCH} - ${EPOCH}])
 same => n,GotoIf($[${SMI_REMAINING} <= 0]?smi-reject,expired,1)
 same => n,WaitForCondition(#,#["#{SMI_DIAL_ALLOWED}" = "1"],${SMI_REMAINING},0.05)
 same => n,GotoIf($["${SMI_DIAL_ALLOWED}" != "1"]?smi-reject,by-cause,1)
 ; exactly ONE Dial for the remaining setup window ([S07]); no infinite retry
 same => n,Set(SMI_REMAINING=$[${SMI_DEADLINE_EPOCH} - ${EPOCH}])
 same => n,Dial(PJSIP/${SMI_CALLEE},${SMI_REMAINING},b(smi-predial^s^1))
 same => n,Goto(smi-finish,report,1)

; ─── Pre-dial handler: runs on the OUTBOUND channel ([S08]) ───
[smi-predial]
exten => s,1,Set(PJSIP_HEADER(add,X-SMI-Call-ID)=${SMI_CALL_ID})
 ; server-generated UUID header — the same header name from a client is never trusted
 same => n,UserEvent(SMICallDialing,SchemaVersion: 1,PbxUniqueId: ${CHANNEL(uniqueid)},Channel: ${CHANNEL(name)},CallId: ${SMI_CALL_ID},Callee: ${SMI_CALLEE})
 same => n,Return()

; ─── Final report after Dial returns ───
[smi-finish]
exten => report,1,NoOp(SMI dial result: DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE})
 same => n,UserEvent(SMICallFinished,SchemaVersion: 1,PbxUniqueId: ${CHANNEL(uniqueid)},Channel: ${CHANNEL(name)},CallId: ${SMI_CALL_ID},CallerEndpoint: ${SMI_CALLER},Callee: ${SMI_CALLEE},DialStatus: ${DIALSTATUS},HangupCause: ${HANGUPCAUSE})
 same => n,Hangup()

; ─── Hangup handler: short, no HTTP/no push/no sleep in the teardown path (spec 8.2) ───
[smi-hangup]
exten => s,1,UserEvent(SMICallFinished,SchemaVersion: 1,PbxUniqueId: ${CHANNEL(uniqueid)},Channel: ${CHANNEL(name)},CallId: ${SMI_CALL_ID},Callee: ${SMI_CALLEE},DialStatus: ${DIALSTATUS},HangupCause: ${HANGUPCAUSE})
 same => n,Return()

; ─── Controlled rejects: whitelist-mapped Q.850 causes (spec 8.2) ───
[smi-reject]
; explicit labels used by smi-call
exten => self,1,Set(SMI_REJECT_CAUSE=21)
 same => n,Hangup(21)
exten => unallocated,1,Set(SMI_REJECT_CAUSE=1)
 same => n,Hangup(1)
exten => unavailable,1,Set(SMI_REJECT_CAUSE=20)
 same => n,Hangup(20)
exten => admission,1,Set(SMI_REJECT_CAUSE=21)
 same => n,Hangup(21)
exten => expired,1,Set(SMI_REJECT_CAUSE=18)
 same => n,Hangup(18)
; control-plane decision arrived via SMI_ADMITTED=-1 + SMI_REJECT_CAUSE (AMI Setvar)
exten => by-cause,1,GotoIf($["${SMI_REJECT_CAUSE}" = "17"]?c17,1)
 same => n,GotoIf($["${SMI_REJECT_CAUSE}" = "21"]?c21,1)
 same => n,GotoIf($["${SMI_REJECT_CAUSE}" = "20"]?c20,1)
 same => n,GotoIf($["${SMI_REJECT_CAUSE}" = "1"]?c1,1)
 same => n,GotoIf($["${SMI_REJECT_CAUSE}" = "18"]?c18,1)
 same => n,Hangup(21)
exten => c17,1,Hangup(17)
exten => c21,1,Hangup(21)
exten => c20,1,Hangup(20)
exten => c18,1,Hangup(18)
exten => c1,1,Hangup(1)
