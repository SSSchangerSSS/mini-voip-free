;
; mini-voip-free — http.conf
; The built-in HTTP server serves ONLY the WebSocket path /ws, loopback-bound.
; Caddy terminates WSS and proxies the exact path /ws to 127.0.0.1:8088 (spec 8.1).
; Static content, AMI-over-HTTP and ARI stay disabled.
;
[general]
enabled=yes
enablestatic=no
bindaddr=127.0.0.1
bindport=8088
; WS sessions of mobile clients may pause while the OS suspends the socket;
; the default write timeout (100ms) is intentionally kept — verify under real
; networks in P2 and document any change.
websocket_write_timeout=100
sessionlimit=100
session_inactivity=30000
