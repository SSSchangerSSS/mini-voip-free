;
; mini-voip-free — manager.conf (AMI)
; Loopback-only. The manager account lives in the GENERATED file manager.d/smi-control.conf
; (rendered by server-init from deploy/secrets/ami — secret never in Git, spec 11.3).
; Runtime action allowlist per spec 8.4: Login/Ping, Setvar/Getvar, Hangup, Status, Reload.
; AMI `Command` and shell execution are not granted and not used.
;
[general]
enabled=yes
webenabled=no
port=5038
bindaddr=127.0.0.1
displayconnects=no
timestampevents=no

#include manager.d/*.conf
