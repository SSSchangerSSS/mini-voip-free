;
; mini-voip-free — modules.conf
; Everything outside the v1 scope is not loaded (spec 8.1): no chan_sip, no ARI,
; no AMI-over-web, no phoneprov, no CEL, no sample conference/paging apps.
;
[modules]
autoload=yes

; legacy SIP channel driver — forbidden (spec 8.1)
noload => chan_sip.so

; ARI family — not used (decided: AMI-only control plane)
noload => res_ari.so
noload => res_ari_model.so
noload => res_ari_applications.so
noload => res_ari_asterisk.so
noload => res_ari_bridges.so
noload => res_ari_channels.so
noload => res_ari_device_states.so
noload => res_ari_endpoints.so
noload => res_ari_events.so
noload => res_ari_mailboxes.so
noload => res_ari_playbacks.so
noload => res_ari_recordings.so
noload => res_stasis.so
noload => res_stasis_playback.so
noload => res_stasis_recording.so
noload => res_stasis_snoop.so

; provisioning/web helpers not needed
noload => res_phoneprov.so
noload => res_http_media_cache.so

; CEL — no call reporting scope in v1 (spec 1.3)
noload => cel_pgsql.so
noload => cel_odbc.so
noload => cel_sqlite3_custom.so
noload => cel_custom.so

; HEP/capture agents — not used
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
