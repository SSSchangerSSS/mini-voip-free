;
; mini-voip-free — pjsip.conf (template; per-extension accounts are GENERATED to
; pjsip/accounts.conf by the control CLI — spec 8.1/11.2. Single source of truth.)
;
; WSS is terminated by Caddy; Asterisk receives plain WS on its built-in HTTP server
; (http.conf → 127.0.0.1:8088, exact path /ws only). Client transports are created
; dynamically on that listener — no public SIP ports exist.

[global]
type=global
user_agent=mini-voip-free
; keep default timers; no NAT helpers needed for WS transports

; Loopback-only UDP transport: guarantees the default 5060 bind never lands on a
; public interface when running under host networking (spec 2.3).
[transport-loopback-udp]
type=transport
protocol=udp
bind=127.0.0.1:5060

; ─── Template for every internal endpoint (spec 8.1) ───
[smi-endpoint-template](!)
type=endpoint
context=smi-internal
webrtc=yes                     ; implies DTLS-SRTP, ICE, rtcp-mux, datagram TLS setup
dtls_auto_generate_cert=yes    ; self-signed DTLS cert w/ fingerprint — NOT the TLS cert for HTTPS/WSS
direct_media=no                ; audio always traverses Asterisk (spec 2.2)
disallow=all
allow=ulaw                     ; v1 codec baseline: PCMU / G.711 µ-law, audio-only
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtls_verify=fingerprint
ice_support=yes
rtcp_mux=yes
use_avpf=yes
media_use_received_transport=no

[smi-auth-template](!)
type=auth
auth_type=userpass
realm=smi

[smi-aor-template](!)
type=aor
max_contacts=1                 ; exactly one device per extension (spec 1.4)
remove_existing=yes
maximum_expiration=3600
minimum_expiration=60

; Generated file — managed exclusively by `smi extension` / `smi device` CLI.
#include pjsip/accounts.conf
