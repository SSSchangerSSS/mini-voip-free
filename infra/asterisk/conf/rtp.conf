;
; mini-voip-free — rtp.conf
; RTP range MUST match the firewall contract exactly: UDP 10000-10199 is the only
; UDP range exposed to the internet (spec 2.3). Healthchecks reference the same numbers.
;
[general]
rtpstart=10000
rtpend=10199
; WebRTC media is DTLS-SRTP/ICE; strict RTP + checksums stay on
strictrtp=yes
rtpchecksums=yes
icesupport=yes
; No STUN/TURN on the PBX path by default. TURN (coturn) exists only in the optional
; `turn` profile after the network gate proves it necessary (spec 2.4).
stunaddr=
turnaddr=
