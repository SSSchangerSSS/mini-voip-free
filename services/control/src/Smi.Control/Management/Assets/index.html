<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت داخلی‌ها | Mini VoIP</title><link rel="stylesheet" href="/admin/admin.css"><body><main><header><div><p class="eyebrow">MINI VOIP</p><h1>مدیریت داخلی‌ها</h1></div><button id="logout" hidden>خروج مدیر</button></header><p id="message" role="status"></p><section id="login"><h2>ورود مدیر</h2><p>رمز مدیریت را از فایل خصوصی روی سرور وارد کنید.</p><form id="loginForm"><label>رمز مدیریت<input id="adminPassword" type="password" autocomplete="current-password" required></label><button>ورود</button></form></section><div id="workspace" hidden><section><h2 id="formTitle">داخلی جدید</h2><form id="extensionForm"><label>شماره داخلی<input id="extension" inputmode="numeric" pattern="1[0-9]{2}" placeholder="106" required></label><label>نام نمایشی<input id="displayName" maxlength="80" placeholder="نام همکار" required></label><label>رمز ورود<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="256"><small>برای حساب جدید حداقل۱۲ نویسه؛ هنگام ویرایش خالی بگذارید تا عوض نشود.</small></label><div class="actions"><button id="save">ساخت داخلی</button><button type="button" id="cancel" class="secondary" hidden>لغو ویرایش</button></div></form></section><section><div class="sectionTitle"><h2>داخلی‌های شرکت</h2><button id="refresh" class="secondary">تازه‌سازی</button></div><p>تعویض رمز یا آزادکردن دستگاه، ورود قبلی را باطل می‌کند. رمزها در فهرست نمایش داده نمی‌شوند.</p><div class="actions"><label>جست‌وجوی نام یا داخلی<input id="search" type="search" placeholder="نام یا شماره"></label><label>وضعیت<select id="statusFilter"><option value="all">همه حساب‌ها</option><option value="enabled">فعال</option><option value="disabled">غیرفعال</option><option value="bound">دستگاه متصل</option><option value="unbound">بدون دستگاه</option></select></label></div><p id="count" role="status"></p><div id="list"></div></section></div><footer>Mini VoIP · مدیریت فقط با حساب مدیر</footer></main><script src="/admin/admin.js" defer></script></body></html>
